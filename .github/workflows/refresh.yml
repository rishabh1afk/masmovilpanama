name: Refresh sentiment data

on:
  schedule:
    - cron: "30 0 * * 1"   # weekly: Monday 00:30 UTC = Monday 06:00 IST (UTC+5:30)
  workflow_dispatch:
    inputs:
      full:
        description: "Full 90-day re-pull ignoring watermarks (≈ US$1.5-2 of Apify credit). Leave off for a cheap incremental run."
        type: boolean
        default: false

permissions:
  contents: write            # needed to commit the refreshed data file

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-refresh.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-refresh.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-xlmr-sentiment-opus-mt-es-en-minilm-v2

      # Budget: Apify FREE plan = US$5/month. One weekly run covers ALL sources incrementally: each collector
      # reads its watermark from data/masmovil.db and asks only for items newer than that (actor date filters,
      # small result limits), skips stored ids, and re-pulls comments only for posts whose comment counter grew.
      # Sentiment/translation/categorisation run only on the new items (cached per text hash / item id).
      - name: Pull new items from all sources and analyse
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}   # repo Actions secret; masked in logs
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && '--full' || '' }}
        run: python refresh.py $FULL

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/masmovil.db data/status.json data/insights.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
