name: Refresh sentiment data

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST, daily
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write            # needed to commit the refreshed data file

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-refresh.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-refresh.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-xlmr-sentiment-opus-mt-es-en-v1

      - name: Pull sources and analyse
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}   # stored as a repo Actions secret; masked in logs
        run: python refresh.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/masmovil.db data/status.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
